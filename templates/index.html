<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özür Dilerim...</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }
        .float-animation {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-950 to-indigo-950 text-white min-h-screen flex flex-col items-center justify-center p-4 overflow-hidden relative">

    <!-- Arka Plan Dekoratif Işıklar -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Ana Kart -->
    <div class="relative z-10 max-w-lg w-89 sm:w-96 bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-8 shadow-2xl text-center float-animation">
        
        <!-- Kalp İkonu -->
        <div class="inline-flex items-center justify-center w-16 h-16 bg-rose-500/20 text-rose-400 rounded-2xl mb-6 shadow-inner border border-rose-500/30">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 animate-pulse" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>

        <!-- Başlık -->
        <h1 class="text-2xl sm:text-3xl font-bold tracking-wide mb-3 bg-gradient-to-r from-rose-300 via-pink-300 to-purple-300 bg-clip-text text-transparent">
            Çok Özür Dilerim
        </h1>

        <!-- Mesaj -->
        <p class="text-slate-300 text-sm sm:text-base leading-relaxed mb-6">
            Kasıtsızlıkla da olsa seni kırdıysam ya da yanlış bir kelime çıktıysa ağzımdan, kalbini kırmak en son isteyeceğim şeydi. Değerlisin, bunu unutmamanı dilerim... Bu şarkıyı da senin için açtım.
        </p>

        <!-- Şarkı Bilgisi -->
        <div class="bg-black/30 border border-white/10 rounded-2xl p-4 flex items-center space-x-4 mb-6">
            <div class="w-12 h-12 bg-rose-500/30 rounded-xl flex items-center justify-center text-rose-300 flex-shrink-0">
                🎵
            </div>
            <div class="text-left overflow-hidden">
                <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Şimdi Çalıyor</p>
                <p class="text-sm font-medium text-white truncate">Rauf & Faik - Vechera (Akşamlar)</p>
            </div>
        </div>

        <!-- İnteraktif Buton -->
        <button onclick="showAlert()" class="w-full py-3 px-6 bg-gradient-to-r from-rose-500 to-purple-600 hover:from-rose-600 hover:to-purple-700 text-white font-semibold rounded-xl shadow-lg transition-all duration-300 transform active:scale-95 cursor-pointer">
            Beni Affet ❤️
        </button>
    </div>

    <!-- Gizli / Otomatik Başlayan YouTube Müzik Çalar (Rauf Faik - Akşamlar) -->
    <div class="hidden">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/5VFCkzCW4vA?autoplay=1&loop=1&playlist=5VFCkzCW4vA" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <!-- Küçük Etkileşim Scripti -->
    <script>
        function showAlert() {
            alert("Umarım bu küçük jest ve şarkı kalbini yumuşatmaya yetmiştir. İyi ki varsın!");
        }
    </script>
</body>
</html>
